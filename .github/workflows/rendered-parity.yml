name: Rendered parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            chrome: /usr/bin/google-chrome
          - os: macos-15
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CHROME: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --bin-links=false
      - name: Record source and browser identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/parity-receipts"
          {
            git rev-parse HEAD
            uname -a
            node --version
            "$CHROME" --version
            git ls-files -s scripts/ci-gate.mjs dev-noisemaker/pixel-parity.html
          } | tee "$RUNNER_TEMP/parity-receipts/identity.log"
      - name: Run the strict unit and rendered gate
        shell: bash
        run: npm run gate 2>&1 | tee "$RUNNER_TEMP/parity-receipts/gate.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parity-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/parity-receipts/
          if-no-files-found: error
