name: Rendered parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            chrome: /usr/bin/google-chrome
          - os: macos-15
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.os }}
    # 60 min: the macOS leg's strict gate includes the installed-workflow
    # unit cycle plus two full rendered sweep pages; 30 cancelled it mid-gate
    # (run 36469100481, macos-15 cancelled inside "Run the strict unit and
    # rendered gate" while the ubuntu leg completed within budget).
    timeout-minutes: 60
    env:
      CHROME: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --bin-links=false
      # Run 36503510015's launch probe proved the runner's Google Chrome
      # hangs at launch: every headless start first runs the macOS Google
      # Updater maintenance flow ("UpdaterMain (--wake-all)"), which stalls
      # for minutes before the browser initializes (60s probe killed
      # mid-updater; the gate's 900s dump windows are consumed the same
      # way). Use Playwright's Chromium - updater-free - as the macOS leg's
      # browser; every parity comparison is same-browser (port vs the
      # pinned legacy bundle), so the choice of browser cannot mask a
      # mismatch.
      - name: Install updater-free Chromium (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          npx -y playwright@1.56.1 install chromium
          CHROME_BIN=$(find "$RUNNER_TEMP/pw-browsers" -type f -path "*MacOS*" \( -name Chromium -o -name headless_shell \) | head -1)
          test -x "$CHROME_BIN"
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          # Page 1 passed but page 2's launch hung twice for 900s with GPU
          # compositor teardown errors in chromium's stderr ("SharedImageManager
          # ::ProduceOverlay ... non-existent mailbox") - the runner VM's GPU
          # compositor hangs after a heavy render. Force software rendering
          # for the gate's dumps; the ubuntu leg already passes the full sweep
          # in software.
          echo "HYDRA_GATE_CHROME_ARGS=--disable-gpu" >> "$GITHUB_ENV"
      - name: Record source and browser identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/parity-receipts"
          {
            git rev-parse HEAD
            uname -a
            node --version
            "$CHROME" --version
            git ls-files -s scripts/ci-gate.mjs dev-noisemaker/pixel-parity.html
          } | tee "$RUNNER_TEMP/parity-receipts/identity.log"
      - name: Run the strict unit and rendered gate
        shell: bash
        run: npm run gate 2>&1 | tee "$RUNNER_TEMP/parity-receipts/gate.log"
      # Job logs are not readable from a read-only session; surface the gate's
      # own lines as check-run annotations when the gate FAILS (the bash
      # shell's default pipefail makes the tee'd step fail with the gate's
      # exit code). Green runs emit nothing.
      - name: Emit gate log as annotations
        if: failure()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/parity-receipts/gate.log" || exit 0
          tail -c 6000 "$RUNNER_TEMP/parity-receipts/gate.log" | grep -E "\[ci-gate\]|\[test\]|Error|error:" | tail -20 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done
      # Decisive launch-level diagnostic: on macOS the gate's dump child
      # hangs with an EMPTY stderr (chrome never initializes logging), while
      # the unit suite's identical chrome launches succeed moments earlier.
      # This step runs the same launch against a trivial URL with a short
      # window and surfaces status/stdout/stderr as annotations.
      - name: Diagnose chrome launch (macOS)
        if: failure() && startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          node -e '
            const { spawnSync } = require("node:child_process")
            const { mkdtempSync } = require("node:fs")
            const { tmpdir } = require("node:os")
            const { join } = require("node:path")
            const t0 = Date.now()
            const r = spawnSync(process.env.CHROME, ["--headless","--no-sandbox","--use-mock-keychain","--user-data-dir=" + mkdtempSync(join(tmpdir(), "diag-chrome-")),"--enable-logging=stderr","--virtual-time-budget=5000","--dump-dom","http://127.0.0.1:9/x"], { encoding: "utf8", timeout: 60000 })
            const out = ["LAUNCH-PROBE elapsed_ms=" + (Date.now() - t0), "status=" + r.status, "error=" + (r.error && r.error.code), "stdout_len=" + (r.stdout || "").length, "stderr_tail=" + ((r.stderr || "").trim().slice(-600).replace(/\n/g, " | "))]
            for (const line of out) console.log("::error::" + line.slice(0, 290))
          ' || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parity-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/parity-receipts/
          if-no-files-found: error
