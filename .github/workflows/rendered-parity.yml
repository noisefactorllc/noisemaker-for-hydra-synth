name: Rendered parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            chrome: /usr/bin/google-chrome
          - os: macos-15
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.os }}
    # 120 min: the macOS leg's strict gate includes the installed-workflow
    # unit cycle (~20 min on the runner) plus the two rendered sweep pages
    # in parallel, each with an env-tunable 2400s window plus one launch
    # retry (worst case ~80 min) - hosted macOS arm64 runners are throttled
    # under capacity pressure, and run 36515359476 exhausted the 75-minute
    # budget mid-gate.
    timeout-minutes: 120
    env:
      CHROME: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --bin-links=false
      # Run 36503510015's launch probe proved the runner's Google Chrome
      # hangs at launch: every headless start first runs the macOS Google
      # Updater maintenance flow ("UpdaterMain (--wake-all)"), which stalls
      # for minutes before the browser initializes (60s probe killed
      # mid-updater; the gate's 900s dump windows are consumed the same
      # way). Use Playwright's Chromium - updater-free - as the macOS leg's
      # browser; every parity comparison is same-browser (port vs the
      # pinned legacy bundle), so the choice of browser cannot mask a
      # mismatch.
      - name: Install updater-free Chromium (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          npx -y playwright@1.56.1 install chromium
          # Prefer the headless shell: it is the dedicated headless dump
          # browser and the only macOS browser verified to complete the
          # strict gate end to end (macOS GPU host: unit 54/0, both size
          # sweeps 71/71 exact, exit 0, with and without --disable-gpu).
          # The full Chromium build printed the complete DOM and then never
          # exited on this runner, and with --disable-gpu (which Chrome 141+
          # needs --enable-unsafe-swiftshader for) its page aborted at the
          # first fixture (run 36530335846: 0/67, THROW at parity_fixture).
          # GPU rendering is kept (run 36531903789: page 1 passed 71/71 with
          # the GPU here); the kill-after-marker dump acceptance handles the
          # non-exiting process. Playwright installs the shell as
          # chromium_headless_shell-*/chrome-headless-shell-mac-arm64/
          # chrome-headless-shell (binary name chrome-headless-shell, no
          # MacOS path component); the full build is the fallback.
          CHROME_BIN=$(find "$RUNNER_TEMP/pw-browsers" -type f -name 'chrome-headless-shell' | head -1)
          if [ -z "$CHROME_BIN" ]; then
            CHROME_BIN=$(find "$RUNNER_TEMP/pw-browsers" -type f -path "*MacOS*" -name Chromium | head -1)
          fi
          test -x "$CHROME_BIN"
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Record source and browser identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/parity-receipts"
          {
            git rev-parse HEAD
            uname -a
            node --version
            "$CHROME" --version
            git ls-files -s scripts/ci-gate.mjs dev-noisemaker/pixel-parity.html
          } | tee "$RUNNER_TEMP/parity-receipts/identity.log"
      - name: Run the strict unit and rendered gate
        shell: bash
        run: npm run gate 2>&1 | tee "$RUNNER_TEMP/parity-receipts/gate.log"
      # Job logs are not readable from a read-only session; surface the gate's
      # own lines as check-run annotations when the gate FAILS (the bash
      # shell's default pipefail makes the tee'd step fail with the gate's
      # exit code). Green runs emit nothing.
      - name: Emit gate log as annotations
        if: failure()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/parity-receipts/gate.log" || exit 0
          tail -c 6000 "$RUNNER_TEMP/parity-receipts/gate.log" | grep -E "\[ci-gate\]|\[test\]|Error|error:" | tail -20 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parity-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/parity-receipts/
          if-no-files-found: error

  # GAP-002 automated continuation: the installed developer workflow on a
  # Windows hosted runner (the last unmeasured declared host reachable in
  # this harness).
  installed-workflow-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CHROME: C:\Program Files\Google\Chrome\Application\chrome.exe
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --bin-links=false
      - name: Run the installed workflow on Windows Chrome
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installed-workflow-receipts"
          { echo "platform=$(node -p process.platform)"; echo "chrome=$CHROME"; echo "node=$(node -v)"; } > "$RUNNER_TEMP/installed-workflow-receipts/identity.log"
          node --test test/installed-workflow.test.mjs 2>&1 | tee "$RUNNER_TEMP/installed-workflow-receipts/installed-workflow-windows.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-workflow-windows-${{ github.sha }}
          path: ${{ runner.temp }}/installed-workflow-receipts/
          if-no-files-found: error

  # GAP-002 automated continuation: minimum-version probe - the installed
  # workflow against an older Chromium than any measured host, probing the
  # practical floor of the declared requirement (WebGL2 + CDN access).
  installed-workflow-minimum-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --bin-links=false
      - name: Install an older Chromium as the minimum-version probe
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-min"
          npx -y playwright@1.47.2 install chromium
          CHROME_BIN=$(find "$RUNNER_TEMP/pw-min" -type f -name chrome -path "*chrome-linux*" | head -1)
          test -x "$CHROME_BIN"
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version | tee "$RUNNER_TEMP/chromium-version.txt"
      - name: Run the installed workflow on the older Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/installed-workflow-receipts"
          { echo "platform=$(node -p process.platform)"; echo "chrome=$CHROME"; echo "node=$(node -v)"; cat "$RUNNER_TEMP/chromium-version.txt"; } > "$RUNNER_TEMP/installed-workflow-receipts/identity.log"
          node --test test/installed-workflow.test.mjs 2>&1 | tee "$RUNNER_TEMP/installed-workflow-receipts/installed-workflow-minimum-version.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-workflow-minimum-version-${{ github.sha }}
          path: ${{ runner.temp }}/installed-workflow-receipts/
          if-no-files-found: error

  # GAP-002 automated continuation: a Safari attempt on a macOS hosted
  # runner. safaridriver (WebDriver) drives the real Safari against the
  # checkout's rendered-parity sweep page; a green run is Safari evidence,
  # a concrete failure is the evidenced automation blocker.
  installed-workflow-safari:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --bin-links=false
      - name: Enable Safari remote automation
        run: sudo safaridriver --enable
      - name: Run the rendered-parity sweep in Safari via WebDriver
        # shell: bash for pipefail: without it the step's exit status is
        # tee's (0), so a FAIL from safaridrive.mjs would still yield a
        # green job and a concrete Safari failure could be masked.
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/safari-receipts"
          node scripts/safaridrive.mjs 2>&1 | tee "$RUNNER_TEMP/safari-receipts/safari-attempt.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-workflow-safari-${{ github.sha }}
          path: ${{ runner.temp }}/safari-receipts/
          if-no-files-found: error
